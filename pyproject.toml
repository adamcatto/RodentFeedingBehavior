[project]
name = "rodent-feeding-behavior"
version = "0.2.0"
description = "Feeding-behaviour analysis of rodents from video: SLEAP pose tracking, bowl contact, feeding bouts, features, group comparisons and figures, with a browser UI."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["behavior", "neuroscience", "feeding", "SLEAP", "pose estimation", "rodent", "mouse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "h5py>=3.11",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "ruamel-yaml>=0.18",
    "markdown>=3.6",
]

[project.optional-dependencies]
# UMAP projections of bout features.
umap = ["umap-learn>=0.5.6"]
# LSTM variational autoencoder + k-means behaviour clustering.
embed = ["torch>=2.3"]

[project.urls]
Repository = "https://github.com/adamcatto/RodentFeedingBehavior"
Documentation = "https://github.com/adamcatto/RodentFeedingBehavior/tree/main/docs/manual"

[project.scripts]
feeding = "feeding.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Only what is in the repository: never local projects, model links or data.
only-include = ["src", "tests", "docs", "scripts", "models/README.md", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/feeding"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "feeding/_docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
