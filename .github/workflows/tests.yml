name: tests

on:
  push:
    branches: [main, windows-support]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra umap --python ${{ matrix.python }}
      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q
